name: Build rawkuma‑dl EXE
on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install uv
              run: |
                  python -m pip install --upgrade pip
                  pip install uv

            - name: Sync dependencies (uv)
              run: uv sync --frozen

            - name: Install pyinstaller
              run: uv pip install pyinstaller

            - name: Build single EXE
              run: |
                  uv run pyinstaller -F main.py

            - name: Upload compiled exe artifact
              uses: actions/upload-artifact@v4
              with:
                  name: rawkuma-dl-windows-exe
                  path: dist/*.exe
